[package]
name = "kp-pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Authenticated peer pairing for KryptoPass"
publish = false

[lib]
name = "kryptopass_pairing"

[[example]]
name = "pairing_demo"
path = "examples/pairing_demo.rs"

[dependencies]
async-trait = "0.1"
getrandom = "0.3"
hkdf = "0.12.4"
kryptopass_identity = { package = "kp-identity", path = "../kp-identity" }
kryptopass_protocol = { package = "kp-protocol", path = "../kp-protocol" }
kryptopass_transport = { package = "kp-transport", path = "../kp-transport" }
prost = "0.14.4"
sha2 = "0.10"
snow = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", default-features = false }
serde_json = "1"

[lints]
workspace = true
