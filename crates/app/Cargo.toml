[package]
name = "kryptopass_app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable Qt application composition and explicit demo backend"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
demo = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:serde_json"]

[dependencies]
cxx = { version = "1.0", optional = true }
cxx-qt = { version = "0.10", optional = true }
cxx-qt-lib = { version = "0.10", features = ["qt_full"], optional = true }
serde_json = { version = "1", optional = true }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[lints]
workspace = true
