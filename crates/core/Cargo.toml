[package]
name = "kryptopass-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "KryptoPass shared domain logic (vaults, crypto contracts)"
publish = false

[dependencies]
anyhow = "1.0"
getrandom = "0.4"
gpgme = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[lints]
workspace = true
