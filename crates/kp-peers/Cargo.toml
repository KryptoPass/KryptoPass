[package]
name = "kp-peers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pairing and connection host: device profile, trust, reconnection, routes and network privacy"
publish = false

[lib]
name = "kryptopass_peers"

[dependencies]
tracing = "0.1"
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.3"
kryptopass_identity = { package = "kp-identity", path = "../kp-identity" }
kryptopass_devices = { package = "kp-devices", path = "../kp-devices" }
kryptopass_sync = { package = "kp-sync", path = "../kp-sync" }
kryptopass_store = { package = "kp-store", path = "../kp-store" }
kryptopass_lan = { package = "kp-lan", path = "../kp-lan" }
kryptopass_pairing = { package = "kp-pairing", path = "../kp-pairing" }
kryptopass_protocol = { package = "kp-protocol", path = "../kp-protocol" }
kryptopass_transport = { package = "kp-transport", path = "../kp-transport", features = ["loopback-dev"] }
serde_json = "1"
rustix = { version = "1.1", features = ["fs", "process", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "io-util", "io-std"] }
zeroize = "1"

[lints]
workspace = true
