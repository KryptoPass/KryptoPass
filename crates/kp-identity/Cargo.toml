[package]
name = "kp-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Device identity and persistent peer trust for KryptoPass"
publish = false

[lib]
name = "kryptopass_identity"

[features]
default = []
test-support = []

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
kp-memsec = { path = "../kp-memsec" }
rustix = { version = "1.1", features = ["fs", "process", "std"] }
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[lints]
workspace = true
