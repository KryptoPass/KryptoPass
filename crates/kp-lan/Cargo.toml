[package]
name = "kp-lan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LAN-only signaling and reliable WebRTC transport for KryptoPass"
publish = false

[lib]
name = "kryptopass_lan"

[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
if-addrs = "0.15"
kp-protocol = { path = "../kp-protocol" }
mdns-sd = "=0.21.5"
kryptopass_transport = { package = "kp-transport", path = "../kp-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1"
# Disabling defaults also disables DTLS crypto; select its standard provider explicitly.
webrtc = { version = "=0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }

[lints]
workspace = true
