[package]
name = "kp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "kryptopass-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
gpgme = { version = "0.11", features = ["v1_15"] }
getrandom = "0.3"
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
comrak = { version = "0.48", default-features = false }
zeroize = "1"
serde_json = "1"
sha2 = "0.10"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
kryptopass-core = { package = "kp-core", path = "../kp-core" }
kryptopass-search = { package = "kp-search", path = "../kp-search" }
kryptopass-keyring = { package = "kp-keyring", path = "../kp-keyring" }
kryptopass_vault = { package = "kp-vault", path = "../kp-vault" }
kryptopass-secure-memory = { package = "kp-memsec", path = "../kp-memsec" }
kryptopass-import = { package = "kp-import", path = "../kp-import" }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
kryptopass-browser = { package = "kp-browser", path = "../kp-browser" }
kryptopass-pairing-lab = { package = "kp-pairing-lab", path = "../kp-pairing-lab" }
kryptopass-identity = { package = "kp-identity", path = "../kp-identity" }
kryptopass-pairing = { package = "kp-pairing", path = "../kp-pairing" }
kryptopass-devices = { package = "kp-devices", path = "../kp-devices" }
kryptopass-lan = { package = "kp-lan", path = "../kp-lan" }
kryptopass-sync = { package = "kp-sync", path = "../kp-sync" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
rqrr = "0.10"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
kryptopass-identity = { package = "kp-identity", path = "../kp-identity", features = ["test-support"] }
ssh-key = { version = "0.6.7", features = ["crypto", "encryption"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[lints]
workspace = true
