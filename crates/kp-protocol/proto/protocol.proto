syntax = "proto3";

package org.kryptopass.protocol.v1;

// This schema is a wire contract shared with future Kotlin implementations.
// Values are never interpreted as Rust-native serialized structs.
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_PAIRING_INVITE = 1;
  MESSAGE_TYPE_PAIRING_HELLO = 2;
  MESSAGE_TYPE_NOISE_HANDSHAKE = 3;
  MESSAGE_TYPE_PAIRING_IDENTITY = 4;
  MESSAGE_TYPE_PAIRING_CONFIRMATION = 5;
  MESSAGE_TYPE_PAIRING_COMPLETE = 6;
  MESSAGE_TYPE_PAIRING_ABORT = 7;
  MESSAGE_TYPE_SYNC_HELLO = 8;
  MESSAGE_TYPE_SYNC_MANIFEST = 9;
  MESSAGE_TYPE_SYNC_REQUEST = 10;
  MESSAGE_TYPE_SYNC_CHUNK = 11;
  MESSAGE_TYPE_SYNC_COMMIT = 12;
  MESSAGE_TYPE_SYNC_ACK = 13;
  MESSAGE_TYPE_SYNC_CONFLICT = 14;
  MESSAGE_TYPE_KEY_TRANSFER_OFFER = 15;
  MESSAGE_TYPE_KEY_TRANSFER_CHUNK = 16;
  MESSAGE_TYPE_KEY_TRANSFER_COMPLETE = 17;
  MESSAGE_TYPE_KEY_TRANSFER_ABORT = 18;
  MESSAGE_TYPE_SESSION_HELLO = 19;
  MESSAGE_TYPE_SESSION_PING = 20;
  MESSAGE_TYPE_SESSION_PONG = 21;
  MESSAGE_TYPE_SESSION_CLOSE = 22;
  MESSAGE_TYPE_SYNTHETIC_KEY_OFFER = 23;
  MESSAGE_TYPE_SYNTHETIC_KEY_DECISION = 24;
  MESSAGE_TYPE_SYNTHETIC_KEY_CHUNK = 25;
  MESSAGE_TYPE_SYNTHETIC_KEY_COMPLETE = 26;
  MESSAGE_TYPE_SYNTHETIC_KEY_RECEIPT = 27;
  MESSAGE_TYPE_SYNTHETIC_KEY_ABORT = 28;
  MESSAGE_TYPE_VAULT_KEYS = 29;
}

// `payload` is the encoded message selected by `message_type`.
message Envelope {
  uint32 protocol_version = 1;
  bytes session_id = 2;
  uint64 message_id = 3;
  MessageType message_type = 4;
  bytes payload = 5;
}

enum AbortCode {
  ABORT_CODE_UNSPECIFIED = 0;
  ABORT_CODE_USER_CANCELLED = 1;
  ABORT_CODE_EXPIRED = 2;
  ABORT_CODE_REJECTED = 3;
  ABORT_CODE_FAILED = 4;
}

message PairingInvite {
  bytes invite_id = 1;            // 16 bytes
  bytes single_use_token = 2;     // 32 random bytes; never log or Debug-print
  uint64 expires_at_unix_ms = 3;
  uint32 protocol_version = 4;    // required; currently 1
}

message PairingHello {
  reserved 2;
  reserved "ephemeral_public_key";
  bytes invite_id = 1;            // 16 bytes
}

message NoiseHandshake {
  uint32 step = 1;                // 1 through 3 for Noise XX
  bytes handshake_message = 2;
}

message PairingIdentity {
  reserved 3;
  reserved "static_public_key";
  bytes device_id = 1;             // 32-byte digest of the signing key
  bytes signing_public_key = 2;    // 32-byte Ed25519 public key
  bytes transcript_hash = 4;       // 32-byte authenticated handshake context
  bytes proof = 5;                 // 64 bytes; signed context is defined in Phase 2
}

message PairingConfirmation {
  bytes transcript_hash = 1;       // 32 bytes
  bool accepted = 2;
}

message PairingComplete {
  bytes transcript_hash = 1;       // 32 bytes
}

message PairingAbort {
  AbortCode code = 1;
}

message SyncHello {
  bytes vault_id = 1;              // 16 bytes
  bytes device_id = 2;             // 32 bytes
  uint64 known_revision_count = 3;
  bytes openpgp_fingerprint = 4;   // 20/32 bytes
}

message RevisionHead {
  bytes record_id = 1;             // 16 bytes
  bytes revision_id = 2;           // 16 bytes
  bytes revision_hash = 3;         // 32 bytes
}

// The manifest is streamed in pages; every page fits one protocol payload.
message SyncManifest {
  bytes snapshot_id = 1;           // 16 bytes, equal on every page
  repeated RevisionHead heads = 2; // at most 256 per page, sorted across pages
  uint32 page_index = 3;           // zero-based, consecutive
  bool last_page = 4;              // true on the final page
}

message RequestedRevision {
  bytes record_id = 1;             // 16 bytes
  bytes revision_id = 2;           // 16 bytes
}

message SyncRequest {
  bytes snapshot_id = 1;           // 16 bytes
  repeated RequestedRevision revisions = 2; // at most 256
}

// `data` is an opaque encrypted object fragment, not plaintext vault content.
message SyncChunk {
  bytes transfer_id = 1;           // 16 bytes
  uint32 chunk_index = 2;          // zero-based
  uint32 chunk_count = 3;
  uint64 total_size = 4;
  bytes sha256_digest = 5;          // digest of complete transfer
  bytes data = 6;                  // at most 48 KiB
}

message SyncCommit {
  bytes transfer_id = 1;           // 16 bytes
  bytes sha256_digest = 2;         // 32 bytes
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_ACCEPTED = 1;
  ACK_STATUS_REJECTED = 2;
}

message SyncAck {
  bytes transfer_id = 1;           // 16 bytes
  AckStatus status = 2;
}

message SyncConflict {
  bytes record_id = 1;             // 16 bytes
  repeated bytes revision_ids = 2; // 2 through 16 unique 16-byte IDs
}

enum SyncOperation {
  SYNC_OPERATION_UNSPECIFIED = 0;
  SYNC_OPERATION_WRITE = 1;
  SYNC_OPERATION_DELETE = 2;
}

// Immutable signed ciphertext object. Signature bytes use the canonical
// representation documented in docs/sin-revisar/sync/modelo-ledger-sync-v1.md; protobuf bytes are not signed.
message SyncRevision {
  bytes vault_id = 1;                       // 16-byte ID; must not be all zero
  bytes record_id = 2;                      // 16-byte ID; must not be all zero
  bytes revision_id = 3;                    // 16-byte ID; must not be all zero
  repeated bytes parent_revision_ids = 4;   // 0..16 unique sorted 16-byte IDs
  bytes author_device_id = 5;               // 32 bytes
  SyncOperation operation = 6;              // WRITE or DELETE
  bytes ciphertext = 7;                     // opaque; <= 2 MiB for WRITE, empty for DELETE
  bytes content_hash = 8;                   // SHA-256(ciphertext), 32 bytes
  bytes signature = 9;                      // strict Ed25519 signature, 64 bytes
}

// One bounded transfer unit; every revision's vault_id must match this field.
message SyncRevisionBatch {
  bytes vault_id = 1;                 // 16-byte ID; must not be all zero
  repeated SyncRevision revisions = 2; // 0..32 revisions; encoded batch <= 8 MiB
}

// These messages reserve the future key-provisioning wire format. Fase 1
// exposes no handler that reads, exports, imports, or persists private keys.
message KeyTransferOffer {
  bytes transfer_id = 1;           // 16 bytes
  bytes openpgp_fingerprint = 2;   // 20 or 32 bytes
  uint64 total_size = 3;
}

message KeyTransferChunk {
  bytes transfer_id = 1;           // 16 bytes
  uint32 chunk_index = 2;          // zero-based
  uint32 chunk_count = 3;
  uint64 total_size = 4;
  bytes sha256_digest = 5;         // digest of complete transfer
  bytes data = 6;                  // at most 48 KiB
}

message KeyTransferComplete {
  bytes transfer_id = 1;           // 16 bytes
  bytes openpgp_fingerprint = 2;   // 20 or 32 bytes
}

message KeyTransferAbort {
  bytes transfer_id = 1;           // 16 bytes
  AbortCode code = 2;
}

// Optional active-session extension, used only after authenticated trust commit.
// Existing pairing messages and their canonical signing context are unchanged.
message SessionHello {
  uint32 session_version = 1;     // required; active-session extension version 1
  bytes device_id = 2;            // 32 bytes; must equal the authenticated peer
  uint32 reconnect_port = 3;      // optional LAN resume endpoint; 0 absent, 1..65535 valid
  uint32 synthetic_key_transfer_version = 4; // 0 disabled, 1 debug synthetic extension, 2 also vault identity, 3 also phone → Desktop vault identity
  uint32 sync_version = 5;        // 0 disabled; 1 explicitly bound revision-sync v1
  uint32 sync_rounds_version = 6; // 0 single round; 1 repeat rounds on this Noise session
  uint32 vault_keys_version = 7;  // 0 unsupported; 1 accepts VaultKeys from the peer (and may send it)
}

// Public fingerprints of the OpenPGP keys the sender holds private keys for, so the
// peer syncs only records encrypted to keys this device can open. Sent by the phone
// after SessionHello when the peer advertised vault_keys_version 1; last message wins.
message VaultKeys {
  repeated bytes openpgp_fingerprints = 1;   // 0..8 entries, 20/32 bytes each, no duplicates
}

message SessionPing {
  uint64 nonce = 1;               // non-zero; one outstanding request per direction
}

message SessionPong {
  uint64 nonce = 1;               // exact echo of the outstanding ping nonce
}

message SessionClose {
  uint32 reason = 1;              // 1 user, 2 app closing, 3 superseded,
                                 // 4 trust revoked, 5 protocol error; others invalid
}

// Debug-only synthetic fixture transfer; never enables production key export.
// Negotiated by SessionHello.synthetic_key_transfer_version == 1 on both sides.
message SyntheticKeyOffer {
  bytes transfer_id = 1;           // 16 non-zero random bytes
  bytes openpgp_fingerprint = 2;   // 20 bytes; fixed synthetic identity
  uint64 total_size = 3;           // 1..1 MiB
  bytes sha256_digest = 4;         // 32 bytes; exact fixed fixture digest
  bytes encrypted_challenge = 5;   // 1..16 KiB; fresh 32-byte challenge encrypted by GnuPG
  uint32 key_purpose = 6;          // 0 synthetic fixture; 1 sender vault identity, requires version 2 (3 for phone → Desktop, purpose 1 only)
}

message SyntheticKeyDecision {
  bytes transfer_id = 1;
  bool accepted = 2;               // human approval; false rejects
}

message SyntheticKeyChunk {
  bytes transfer_id = 1;
  uint32 chunk_index = 2;
  uint32 chunk_count = 3;
  uint64 total_size = 4;
  bytes sha256_digest = 5;
  bytes data = 6;                  // 1..32 KiB; strict sequential assembly
}

message SyntheticKeyComplete {
  bytes transfer_id = 1;           // sender finished; does not acknowledge storage
}

message SyntheticKeyReceipt {
  bytes transfer_id = 1;
  bytes openpgp_fingerprint = 2;   // 20 bytes
  bytes challenge_sha256 = 3;      // 32 bytes; only after persistence and decryption
}

message SyntheticKeyAbort {
  bytes transfer_id = 1;
  AbortCode code = 2;
}
