[package]
name = "kp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "KryptoPass shared domain logic (vaults, crypto contracts)"
publish = false

[lib]
name = "kryptopass_core"

[dependencies]
kryptopass-secure-memory = { package = "kp-memsec", path = "../kp-memsec" }
anyhow = "1.0"
deunicode = "1.6.2"
getrandom = "0.4"
gpgme = "0.11"
percent-encoding = "2.3"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
ssh-key = { version = "0.6.7", features = ["crypto", "encryption"] }
thiserror = "2.0"
totp-rs = { version = "5.7.2", default-features = false, features = ["zeroize"] }
url = "2"
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[lints]
workspace = true
