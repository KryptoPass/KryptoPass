[package]
name = "kryptopass-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
gpgme = { version = "0.11", features = ["v1_15"] }
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
comrak = { version = "0.48", default-features = false }
zeroize = "1"
serde_json = "1"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
kryptopass-core = { path = "../core" }
kryptopass-import = { path = "../import" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[lints]
workspace = true
