# Bacon — chequeo continuo en fondo.
# `bacon` (job check) | `bacon clippy` | `bacon test` | `bacon qmllint`
# Para el ciclo de edición usa `bacon clippy`; `just verify` es la puerta completa.
# Sin analyzer dedicado para qmllint: se muestra la salida tal cual
# y el fallo lo marca el exit code (!= 0 ante cualquier warning).

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.audit]
command = ["just", "audit"]
need_stdout = true
default_watch = false
watch = ["Cargo.lock", ".cargo/audit.toml"]

[jobs.test]
command = ["cargo", "test", "--workspace"]
need_stdout = true

[jobs.test-items]
command = ["just", "test-items"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/ui/qml", "crates/kp-desktop/ui/tests", "crates/kp-desktop/build.rs"]

[jobs.cxx-tidy]
command = ["just", "cxx-tidy"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/src/native", "crates/kp-desktop/build.rs", ".clang-tidy", "tools/cxx_tidy.py"]

[jobs.test-icons]
command = ["just", "test-icons"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/src/native", "crates/kp-desktop/native-tests"]

[jobs.test-session-lock]
command = ["just", "test-session-lock"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/src/native/session_lock.h", "crates/kp-desktop/src/native/session_lock.cpp", "crates/kp-desktop/native-tests"]

[jobs.run]
command = ["just", "run"]
need_stdout = true
default_watch = true
background = false
on_change_strategy = "kill_then_restart"
watch = ["crates", ".cargo", "packaging", "tools", "justfile"]

[jobs.qmllint]
command = ["just", "lint"]
need_stdout = true
default_watch = false
watch = ["crates", "tools/qml_lint.py", "packaging/metadata.py"]

[jobs.smoke]
command = ["just", "smoke"]
need_stdout = true
default_watch = false
watch = ["crates"]

[keybindings]
q = "job:qmllint"

[jobs.metadata]
command = ["just", "metadata"]
need_stdout = true
default_watch = false
watch = ["Cargo.toml", "packaging"]

[jobs.distro-check]
command = ["just", "distro-check"]
need_stdout = true
default_watch = false
watch = ["CMakeLists.txt", "doc/CMakeLists.txt", "Cargo.toml", "packaging"]

[jobs.handbook]
command = ["just", "handbook"]
need_stdout = true
default_watch = false
watch = ["doc"]

[jobs.translations]
command = ["just", "translations-check"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop", "po", "packaging/translations.py"]

[jobs.i18n]
command = ["just", "i18n-check"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/src", "crates/kp-desktop/ui/qml", "po", "Messages.sh", "tools/i18n.py"]

[jobs.licenses]
command = ["just", "licenses"]
need_stdout = true
default_watch = false
watch = ["REUSE.toml", "LICENSES", "crates", "docs", "packaging", "tools"]

[jobs.test-packaging]
command = ["just", "test-packaging"]
need_stdout = true
default_watch = false
watch = ["tests", "packaging", "tools", "Cargo.toml"]

[jobs.clean]
command = ["just", "clean"]
need_stdout = true
default_watch = false
watch = ["crates", "docs", "packaging", "tools", "tests"]

[jobs.screenshot]
command = ["just", "screenshot"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop", "packaging/capture_screenshot.py"]

[jobs.browser]
command = ["just", "browser-build"]
need_stdout = true
default_watch = false
watch = ["../kryptopass-core/crates/kp-browser", "../kryptopass-core/crates/kp-pinentry", "tools/browser_integration.py", "packaging/metadata.py", "Cargo.toml"]

[jobs.qmlls]
command = ["just", "qmlls"]
need_stdout = true
background = false
default_watch = false
watch = ["crates/kp-desktop", ".qmlls.ini"]

[jobs.fmt]
command = ["just", "fmt"]
need_stdout = true
default_watch = false
watch = ["crates", "tools/source_format.py", ".clang-format", ".qmlformat.ini", ".editorconfig"]

[jobs.prepare-synthetic-sync-fixture]
command = ["just", "prepare-synthetic-sync-fixture"]
need_stdout = true
default_watch = false
watch = ["tools/prepare_synthetic_sync_fixture.py"]
