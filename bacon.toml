# Bacon — chequeo continuo en fondo.
# `bacon` (job check) | `bacon clippy` | `bacon test` | `bacon qmllint`
# Para el ciclo de edición usa `bacon clippy`; `just verify` es la puerta completa.
# Sin analyzer dedicado para qmllint: se muestra la salida tal cual
# y el fallo lo marca el exit code (!= 0 ante cualquier warning).

default_job = "check"

[jobs.test-network-privacy]
command = ["just", "test-network-privacy"]
need_stdout = true
default_watch = false
watch = ["crates/kp-lan", "crates/kp-pairing-lab", "crates/kp-devices", "crates/kp-protocol", "crates/kp-desktop/src/transport_diagnostics.rs", "crates/kp-desktop/src/transport_diagnostics_tests.rs"]

[jobs.check]
command = ["cargo", "check", "--workspace"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace"]
need_stdout = true

[jobs.test-security]
command = ["just", "test-security"]
need_stdout = true
default_watch = false
watch = ["crates/kp-memsec", "crates/kp-desktop/src/process_security.rs", "crates/kp-desktop/tests/unit/process_security.rs", "crates/kp-desktop/src/infrastructure/openpgp.rs", "crates/kp-desktop/tests/unit/infrastructure/openpgp.rs"]

[jobs.test-search]
command = ["just", "test-search"]
need_stdout = true
default_watch = false
watch = ["crates/kp-search", "crates/kp-memsec", "crates/kp-desktop/src/search", "crates/kp-desktop/src/ui_adapters/search_controller.rs", "crates/kp-desktop/tests/unit/search_projection.rs", "crates/kp-desktop/tests/unit/search_source.rs"]

[jobs.test-items]
command = ["just", "test-items"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/ui/qml", "crates/kp-desktop/ui/tests", "crates/kp-desktop/build.rs"]

[jobs.check-p2p]
command = ["just", "check-p2p"]
need_stdout = false
default_watch = false
watch = ["crates/kp-protocol", "crates/kp-transport", "crates/kp-identity", "crates/kp-pairing", "Cargo.toml", "Cargo.lock"]

[jobs.test-p2p]
command = ["just", "test-p2p"]
need_stdout = true
default_watch = false
watch = ["crates/kp-protocol", "crates/kp-transport", "crates/kp-identity", "crates/kp-pairing", "Cargo.toml", "Cargo.lock"]

[jobs.p2p-demo]
command = ["just", "p2p-demo"]
need_stdout = true
default_watch = false
watch = ["crates/kp-protocol", "crates/kp-transport", "crates/kp-identity", "crates/kp-pairing", "Cargo.toml", "Cargo.lock"]

[jobs.test-sync]
command = ["just", "test-sync"]
need_stdout = true
default_watch = false
watch = ["crates/kp-sync", "crates/kp-protocol", "crates/kp-identity", "crates/kp-transport", "Cargo.toml", "Cargo.lock"]

[jobs.test-sync-session]
command = ["just", "test-sync-session"]
need_stdout = true
allow_warnings = false
watch = ["crates/kp-sync", "crates/kp-devices", "crates/kp-protocol", "crates/kp-pairing", "Cargo.toml", "Cargo.lock"]

[jobs.test-vault-sync]
command = ["just", "test-vault-sync"]
need_stdout = true
allow_warnings = false
watch = ["crates/kp-core", "crates/kp-sync", "crates/kp-vault", "crates/kp-desktop/src/vault_sync", "crates/kp-desktop/tests/unit/vault_sync.rs", "Cargo.toml", "Cargo.lock"]

[jobs.verify-sync-session]
command = ["just", "verify-sync-session"]
need_stdout = true
allow_warnings = false
watch = ["crates/kp-sync", "crates/kp-devices", "crates/kp-protocol", "crates/kp-pairing", "crates/kp-transport", "Cargo.toml", "Cargo.lock"]

[jobs.sync-demo]
command = ["just", "sync-demo"]
need_stdout = true
default_watch = false
watch = ["crates/kp-sync", "crates/kp-identity", "Cargo.toml", "Cargo.lock"]

[jobs.test-sync-stress]
command = ["just", "test-sync-stress"]
need_stdout = true
default_watch = false
watch = ["crates/kp-sync", "Cargo.toml", "Cargo.lock"]

[jobs.sync-interop-host]
command = ["just", "sync-interop-host"]
need_stdout = true
default_watch = false
watch = ["crates/kp-sync", "Cargo.toml", "Cargo.lock"]

[jobs.test-icons]
command = ["just", "test-icons"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/src/native", "crates/kp-desktop/native-tests"]

[jobs.test-session-lock]
command = ["just", "test-session-lock"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/src/native/session_lock.h", "crates/kp-desktop/src/native/session_lock.cpp", "crates/kp-desktop/native-tests"]

[jobs.run]
command = ["just", "run"]
need_stdout = true
default_watch = true
background = false
on_change_strategy = "kill_then_restart"
watch = ["crates", ".cargo", "packaging", "tools", "justfile"]

[jobs.qmllint]
command = ["just", "lint"]
need_stdout = true
default_watch = false
watch = ["crates", "tools/qml_lint.py", "packaging/metadata.py"]

[jobs.smoke]
command = ["just", "smoke"]
need_stdout = true
default_watch = false
watch = ["crates"]

[jobs.turn-smoke]
command = ["just", "turn-smoke"]
need_stdout = true
default_watch = false
watch = ["crates/kp-lan", "justfile", "bacon.toml"]

[keybindings]
q = "job:qmllint"

[jobs.metadata]
command = ["just", "metadata"]
need_stdout = true
default_watch = false
watch = ["Cargo.toml", "packaging"]

[jobs.distro-check]
command = ["just", "distro-check"]
need_stdout = true
default_watch = false
watch = ["CMakeLists.txt", "doc/CMakeLists.txt", "Cargo.toml", "packaging"]

[jobs.handbook]
command = ["just", "handbook"]
need_stdout = true
default_watch = false
watch = ["doc"]

[jobs.translations]
command = ["just", "translations-check"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop", "po", "packaging/translations.py"]

[jobs.licenses]
command = ["just", "licenses"]
need_stdout = true
default_watch = false
watch = ["REUSE.toml", "LICENSES", "crates", "docs", "packaging", "tools"]

[jobs.test-packaging]
command = ["just", "test-packaging"]
need_stdout = true
default_watch = false
watch = ["tests", "packaging", "tools", "Cargo.toml"]

[jobs.clean]
command = ["just", "clean"]
need_stdout = true
default_watch = false
watch = ["crates", "docs", "packaging", "tools", "tests"]

[jobs.screenshot]
command = ["just", "screenshot"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop", "packaging/capture_screenshot.py"]

[jobs.browser]
command = ["just", "browser-build"]
need_stdout = true
default_watch = false
watch = ["crates/kp-browser", "tools/browser_integration.py", "packaging/metadata.py", "Cargo.toml"]

[jobs.qmlls]
command = ["just", "qmlls"]
need_stdout = true
background = false
default_watch = false
watch = ["crates/kp-desktop", ".qmlls.ini"]

[jobs.fmt]
command = ["just", "fmt"]
need_stdout = true
default_watch = false
watch = ["crates", "tools/source_format.py", ".clang-format", ".qmlformat.ini", ".editorconfig"]

[jobs.fmt-native]
command = ["just", "fmt-native"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/src/native", "crates/kp-desktop/native-tests", "tools/source_format.py", ".clang-format"]

[jobs.fmt-qml]
command = ["just", "fmt-qml"]
need_stdout = true
default_watch = false
watch = ["crates/kp-desktop/ui", "tools/source_format.py", ".qmlformat.ini"]

[jobs.fmt-rust]
command = ["just", "fmt-rust"]
need_stdout = true
[jobs.pairing-lab]
command = ["cargo", "check", "-p", "kp-pairing-lab", "-p", "kp-desktop"]
need_stdout = false
[jobs.check-lan]
command = ["just", "check-lan"]
need_stdout = false
watch = ["crates/kp-lan", "crates/kp-pairing-lab", "crates/kp-transport", "Cargo.toml", "Cargo.lock"]

[jobs.check-devices]
command = ["just", "check-devices"]
need_stdout = false
watch = ["crates/kp-devices", "crates/kp-pairing", "crates/kp-pairing-lab", "crates/kp-protocol", "crates/kp-transport", "Cargo.toml", "Cargo.lock"]

[jobs.prepare-synthetic-sync-fixture]
command = ["just", "prepare-synthetic-sync-fixture"]
need_stdout = true
default_watch = false
watch = ["scripts/prepare_synthetic_sync_fixture.py"]

[jobs.test-synthetic-key-transfer]
command = ["just", "test-synthetic-key-transfer"]
need_stdout = true
default_watch = false
watch = ["crates/kp-devices", "crates/kp-protocol"]
