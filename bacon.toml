# Bacon — chequeo continuo en fondo.
# `bacon` (job check) | `bacon clippy` | `bacon test` | `bacon qmllint`
# Sin analyzer dedicado para qmllint: se muestra la salida tal cual
# y el fallo lo marca el exit code (!= 0 ante cualquier warning).

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--workspace"]
need_stdout = true

[jobs.test-items]
command = ["just", "test-items"]
need_stdout = true
default_watch = false
watch = ["crates/desktop/ui/qml", "crates/desktop/ui/tests", "crates/desktop/build.rs"]

[jobs.test-icons]
command = ["just", "test-icons"]
need_stdout = true
default_watch = false
watch = ["crates/desktop/src/native", "crates/desktop/native-tests"]

[jobs.run]
command = ["just", "run"]
need_stdout = true
default_watch = true
background = false
watch = ["crates", ".cargo", "packaging", "justfile"]

[jobs.qmllint]
command = ["just", "lint"]
need_stdout = true
default_watch = false
watch = ["crates"]

[jobs.smoke]
command = ["just", "smoke"]
need_stdout = true
default_watch = false
watch = ["crates"]

[keybindings]
q = "job:qmllint"

[jobs.metadata]
command = ["just", "metadata"]
need_stdout = true
default_watch = false
watch = ["Cargo.toml", "packaging"]

[jobs.translations]
command = ["just", "translations-check"]
need_stdout = true
default_watch = false
watch = ["crates/desktop", "po", "packaging/translations.py"]

[jobs.licenses]
command = ["just", "licenses"]
need_stdout = true
default_watch = false
watch = ["REUSE.toml", "LICENSES", "crates", "docs", "packaging"]

[jobs.test-packaging]
command = ["just", "test-packaging"]
need_stdout = true
default_watch = false
watch = ["tests", "packaging", "Cargo.toml"]

[jobs.clean]
command = ["just", "clean"]
need_stdout = true
default_watch = false
watch = ["crates", "docs", "packaging", "tests"]

[jobs.screenshot]
command = ["just", "screenshot"]
need_stdout = true
default_watch = false
watch = ["crates/desktop", "packaging/capture_screenshot.py"]
