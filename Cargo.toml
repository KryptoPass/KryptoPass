[workspace]
resolver = "2"
members = ["crates/desktop", "crates/core", "crates/import"]
# Por defecto solo la app; el resto con --workspace / -p.
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Organize credentials and secure notes with OpenPGP encryption"
homepage = "https://github.com/KryptoPass/KryptoPass"
repository = "https://github.com/KryptoPass/KryptoPass"
authors = ["KryptoPass contributors"]

[workspace.metadata.kryptopass]
app-id = "org.kryptopass.desktop"
display-name = "KryptoPass"
organization = "KryptoPass"
organization-domain = "kryptopass.org"
summary = "Organize credentials and secure notes with OpenPGP encryption"
developer-id = "org.kryptopass"
developer-name = "KryptoPass contributors"
copyright = "2026 KryptoPass contributors"
release-date = "2026-10-09"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
