[package]
name = "kryptopass"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
thiserror = "2.0.16"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }

# RustCrypto
aes-gcm = { version = "0.10.3", features = ["alloc"], optional = true }
chacha20poly1305 = { version = "0.10.1", features = ["alloc"], optional = true }
aes = { version = "0.8.4", optional = true }
ctr = { version = "0.9.2", optional = true }
cbc = { version = "0.1.2", optional = true, features = ["block-padding"] }
pkcs7 = { version = "0.4.1", optional = true }

# OpenSSL
openssl = { version = "0.10.73", optional = true }

[features]
# RustCrypto
aes-gcm = ["dep:aes-gcm"]
chacha20poly1305 = ["dep:chacha20poly1305"]
aes = ["dep:aes"]
ctr = ["dep:ctr"]
cbc = ["dep:cbc"]
pkcs7 = ["dep:pkcs7"]

# OpenSSL
openssl = ["dep:openssl"]

backend-rustcrypto = ["aes-gcm", "chacha20poly1305", "aes", "ctr", "cbc", "pkcs7"]
backend-openssl    = ["openssl"]
default = ["backend-rustcrypto"]
