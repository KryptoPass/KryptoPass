[workspace]
resolver = "2"
members = ["crates/desktop", "crates/core", "crates/import"]
# Por defecto solo la app; el resto con --workspace / -p.
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "KryptoPass desktop application built with Rust, CXX-Qt, and QML"
# Nota: homepage/repository/documentation se centralizan aquí cuando se
# confirmen las URLs oficiales; app_info los lee con option_env!.

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
