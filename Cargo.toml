[workspace]
resolver = "2"
members = [".", "experiments/kp-url-sanitizer", "experiments/kp-login-analysis"]
# Código de terceros con sus propios lints; se usa como dependencia por ruta.
exclude = ["third_party/cxx-kde-frameworks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Organize credentials and secure notes with OpenPGP encryption"
homepage = "https://github.com/KryptoPass/KryptoPass"
repository = "https://github.com/KryptoPass/KryptoPass"
authors = ["KryptoPass contributors"]

[workspace.metadata.kryptopass]
app-id = "org.kryptopass.desktop"
browser-host-id = "org.kryptopass.browser"
browser-extension-id = "org.kryptopass.browser@kryptopass.org"
display-name = "KryptoPass"
organization = "KryptoPass"
organization-domain = "kryptopass.org"
summary = "Organize credentials and secure notes with OpenPGP encryption"
developer-id = "org.kryptopass"
developer-name = "KryptoPass contributors"
copyright = "2026 KryptoPass contributors"
release-date = "2026-10-09"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[package]
name = "kp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "kryptopass-desktop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# KDE Frameworks bindings for CXX-Qt; see third_party/cxx-kde-frameworks/KRYPTOPASS.md.
cxx-kde-frameworks = { path = "third_party/cxx-kde-frameworks" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "blocking"] }
url = "2"
libc = "0.2"
gpgme = { version = "0.11", features = ["v1_15"] }
getrandom = "0.3"
rusqlite = { version = "0.41", default-features = false }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
comrak = { version = "0.48", default-features = false }
zeroize = "1"
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
kryptopass-core = { package = "kp-core", path = "../kryptopass-core/crates/kp-core" }
kryptopass-search = { package = "kp-search", path = "../kryptopass-core/crates/kp-search" }
kryptopass-keyring = { package = "kp-keyring", path = "../kryptopass-core/crates/kp-keyring" }
kryptopass-app = { package = "kp-app", path = "../kryptopass-core/crates/kp-app" }
kryptopass-backend = { package = "kp-backend", path = "../kryptopass-core/crates/kp-backend" }
kryptopass-store = { package = "kp-store", path = "../kryptopass-core/crates/kp-store" }
kp-template = { path = "../kryptopass-core/crates/kp-template" }
kryptopass-generator = { package = "kp-generator", path = "../kryptopass-core/crates/kp-generator" }
kryptopass-secure-memory = { package = "kp-memsec", path = "../kryptopass-core/crates/kp-memsec" }
kryptopass-import = { package = "kp-import", path = "../kryptopass-core/crates/kp-import" }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
kryptopass-browser = { package = "kp-browser", path = "../kryptopass-core/crates/kp-browser" }
kryptopass-approval = { package = "kp-approval", path = "../kryptopass-core/crates/kp-approval" }
kryptopass-peers = { package = "kp-peers", path = "../kryptopass-core/crates/kp-peers" }
kryptopass-identity = { package = "kp-identity", path = "../kryptopass-core/crates/kp-identity" }
kryptopass-pairing = { package = "kp-pairing", path = "../kryptopass-core/crates/kp-pairing" }
kryptopass-devices = { package = "kp-devices", path = "../kryptopass-core/crates/kp-devices" }
kryptopass-lan = { package = "kp-lan", path = "../kryptopass-core/crates/kp-lan" }
kryptopass-sync = { package = "kp-sync", path = "../kryptopass-core/crates/kp-sync" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
rqrr = "0.11"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
kryptopass-identity = { package = "kp-identity", path = "../kryptopass-core/crates/kp-identity", features = ["test-support"] }
ssh-key = { version = "0.6.7", features = ["crypto", "encryption"] }

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
# Same version CXX-Qt uses; build.rs configures the `cc::Build` CXX-Qt hands it.
cc = "1"

[lints]
workspace = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.release]
lto = "thin"
