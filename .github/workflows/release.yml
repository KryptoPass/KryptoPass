name: Release

# Releases are tag-driven on purpose: pushing commits never publishes anything.
on:
  push:
    tags:
      - "v[0-9]*"

# Nothing outside the publish job needs write access.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      # Pin the image by digest so a mutable tag cannot change the build host.
      image: archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the tagged source
        # v6.1.0; keep the commit pin instead of a mutable tag.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checkout ownership inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git rustup cmake ninja pkgconf clang lld python
          extra-cmake-modules kdoctools
          qt6-base qt6-declarative qt6-tools qt6-svg kirigami qqc2-desktop-style
          kcontacts akonadi-contacts kxmlgui kconfig kidletime kio gpgme sqlite

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Validate the release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match [workspace.package].version ($version)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and install
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKRYPTOPASS_TURN_BROKER_ORIGIN=https://signal.kryptopass.org
          cmake --build build
          DESTDIR="$PWD/stage" cmake --install build
          install -Dm644 COPYING "stage/usr/share/licenses/org.kryptopass.desktop/COPYING"

      - name: Create release assets
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="kryptopass-desktop-${VERSION}/" \
            -o "dist/kryptopass-desktop-${VERSION}.tar.gz" HEAD
          tar -C stage -czf \
            "dist/kryptopass-desktop-${VERSION}-archlinux-x86_64-install-tree.tar.gz" .
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Upload release assets
        # v7.0.2; keep the commit pin instead of a mutable tag.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        # v8.0.2; keep the commit pin instead of a mutable tag.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-assets
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --verify-tag \
              --title "KryptoPass Desktop $TAG" \
              --generate-notes
          fi
