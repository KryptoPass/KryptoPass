name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      CARGO_TERM_COLOR: always
    steps:
      - name: Install build and desktop dependencies
        # Without fonts, Qt's placeholder glyph metrics clip the large-font dialog.
        run: >-
          pacman -Syu --noconfirm --needed
          git rustup just cmake ninja pkgconf clang lld python reuse extra-cmake-modules breeze-icons ttf-dejavu
          qt6-base qt6-declarative qt6-tools qt6-svg kirigami qqc2-desktop-style
          kcontacts akonadi-contacts kxmlgui kconfig kidletime gpgme sqlite
          appstream desktop-file-utils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust checkout ownership inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Record build environment
        id: native
        run: |
          pacman -Q
          fc-match sans-serif
          fingerprint=$(pacman -Q | sha256sum | cut -d ' ' -f 1)
          echo "packages=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Arch updates Qt/KDE/C++ in place; never reuse native builds across versions.
          prefix-key: arch-v1-${{ steps.native.outputs.packages }}
          cache-on-failure: true
      # Keep these recipes in sync with the dependencies of `just verify`.
      - name: Rust formatting
        run: just fmt
      - name: Check workspace and generate QML types
        id: check
        run: just check
      - name: Clippy
        run: just clippy
      # Once the workspace builds, report independent failures in the same run.
      - name: QML lint
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: just lint
      - name: Native tests (icons and session lock)
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: just test-icons test-session-lock
      - name: QML tests
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: just test-items
      - name: Rust tests
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: just test
      - name: Packaging tests and metadata
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: just test-packaging metadata
      - name: Translation catalogs
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: just translations-check
      - name: License declarations
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: just licenses
      - name: Smoke test with isolated user data
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: just smoke
