name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Install build and desktop dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git rustup just cmake ninja pkgconf clang lld python reuse extra-cmake-modules breeze-icons
          qt6-base qt6-declarative qt6-tools qt6-svg kirigami qqc2-desktop-style
          kcontacts akonadi-contacts kxmlgui kconfig gpgme sqlite
          appstream desktop-file-utils
      - uses: actions/checkout@v4
      - name: Trust checkout ownership inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Verify
        run: just verify
      - name: Smoke test with isolated user data
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          QT_QPA_PLATFORM: offscreen
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          just smoke
      - name: Smoke test the portable Rust/QML composition on the host
        run: just android-ui-smoke

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:base-devel
    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Install Android build host dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git rustup just cmake ninja python python-pip pkgconf clang lld
          qt6-base qt6-declarative qt6-tools qt6-svg qt6-shadertools qt6-tasktree
          extra-cmake-modules breeze-icons jdk21-openjdk unzip zstd
      - uses: actions/checkout@v4
      - name: Trust checkout and install the pinned Rust toolchain
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rustup show
          rustup target add aarch64-linux-android
          cargo --quiet xtask android versions >> "$GITHUB_ENV"
      - name: Cache Qt downloads and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/kryptopass-qt
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-tools-${{ runner.os }}-${{ env.QT_VERSION }}-${{ env.NDK_VERSION }}-${{ hashFiles('Cargo.lock', 'packaging/android-ui/CMakeLists.txt') }}
      - uses: android-actions/setup-android@v3
      - name: Install the reference SDK, NDK and Qt Android
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          python -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall==3.3.0
          if [ ! -f "$HOME/.cache/kryptopass-qt/$QT_VERSION/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake" ]; then
            "$RUNNER_TEMP/aqt/bin/aqt" install-qt all_os android "$QT_VERSION" android_arm64_v8a --outputdir "$HOME/.cache/kryptopass-qt" --modules qtshadertools qttasktree
          fi
      - name: Diagnose the Android environment
        run: just android-doctor
      - name: Build the ARM64 demo APK
        run: just android
      - name: Upload the demo APK
        uses: actions/upload-artifact@v4
        with:
          name: kryptopass-ui-android-arm64-debug
          path: target/kryptopass-ui-android-debug.apk
          if-no-files-found: error
          retention-days: 7
